<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/isrc-icon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/isrc-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/isrc-icon-180.png" />

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

          navigator.serviceWorker.register('/sw.js');
        });
      }
